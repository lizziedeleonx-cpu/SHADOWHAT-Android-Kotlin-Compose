
name: Build SHADOWHAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        shell: bash
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró el ZIP en la raíz del repositorio."
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_FILE=$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle.kts ni settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOWHAT-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
        
