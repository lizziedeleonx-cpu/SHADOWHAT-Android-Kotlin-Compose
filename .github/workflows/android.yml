name: Build SHADOWHAT APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extraer proyecto Android
    run: |
      mkdir -p extracted
      unzip -o SHADOWHAT-Android-Kotlin-Compose.zip -d extracted
      PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
      if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted" ]; then
        PROJECT_DIR="extracted"
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Proyecto encontrado en: $PROJECT_DIR"

  - name: Compilar APK
    run: |
      cd "$PROJECT_DIR"
      chmod +x gradlew 2>/dev/null || true
      if [ -f "./gradlew" ]; then
        ./gradlew --no-daemon assembleDebug
      else
        echo "No se encontró gradlew. El proyecto necesita su Gradle Wrapper."
        exit 1
      fi

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: SHADOWHAT-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
