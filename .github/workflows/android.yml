
name: Build SHADOWHAT APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SHADOWHAT-Android-Kotlin-Compose.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Extraer proyecto Android
        run: |
          mkdir -p extracted
          unzip -q SHADOWHAT-Android-Kotlin-Compose.zip -d extracted
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -type f -print -quit | xargs dirname)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            echo "No existe gradlew. Usando Gradle Wrapper JAR..."
            java -classpath "gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain --no-daemon assembleDebug
          fi

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOWHAT-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
